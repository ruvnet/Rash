<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc"><title id="title">Rash / SCRIPT</title><desc id="desc">ActionScript inspired source passes through a dedicated Rust and WASM worker; validated scene commands move an SVG node. Editorial workflow illustration.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.command{transform:translate(660px,243px);animation:command 5s linear infinite}@keyframes command{0%,10%{transform:translate(477px,162px);opacity:0}15%{opacity:1}35%{transform:translate(477px,192px)}50%{transform:translate(519px,192px);opacity:0}55%{transform:translate(635px,243px);opacity:0}65%{opacity:1}85%,100%{transform:translate(709px,243px);opacity:0}}.script-node{transform:translate(844px,266px);animation:node 5s cubic-bezier(.22,1,.36,1) infinite}@keyframes node{0%,65%,100%{transform:translate(764px,266px)}82%,94%{transform:translate(868px,266px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}*{animation:none!important}</style><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09131c"/><stop offset="1" stop-color="#121323"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#557184" opacity=".25"/></pattern></defs><rect x="0" y="0" width="960" height="400" fill="url(#bg)" rx="18"/><rect x="0.5" y="0.5" width="959" height="399" fill="none" rx="18" stroke="#293847"/><text x="36" y="68" fill="#9bf3d0" font-size="12" letter-spacing="2" font-weight="700">04 / SCRIPT</text><text x="33" y="148" fill="#f0f3ee" font-size="49" font-weight="800" letter-spacing="-2">Code the</text><text x="33" y="202" fill="#f0f3ee" font-size="49" font-weight="800" letter-spacing="-2">interaction.</text><text x="36" y="242" fill="#91a2b3" font-size="15">A bounded ActionScript inspired subset.</text><text x="36" y="265" fill="#91a2b3" font-size="15">Rust and WebAssembly under the hood.</text><rect x="36" y="296" width="36" height="3" fill="#9bf3d0" rx="1.5"/><text x="36" y="326" fill="#9bf3d0" font-size="10" letter-spacing="0.8">SOURCE → WORKER → SVG</text><rect x="400" y="54" width="520" height="107" fill="#0d1622" rx="12" stroke="#293847"/><text x="420" y="77" fill="#91a2b3" font-size="10" letter-spacing="1.3">ACTIONS</text><rect x="795" y="64" width="107" height="24" fill="#ff7954" rx="12" fill-opacity="0.1" stroke="#ff7954" stroke-opacity="0.3"/><text x="848.5" y="80" fill="#ff7954" font-size="10" text-anchor="middle" letter-spacing="1">SOURCE SUBSET</text><text x="420" y="110" fill="#9bf3d0" font-size="18" font-family="monospace">getNode(&quot;hero&quot;).x = 120;</text><text x="420" y="138" fill="#b6a1ff" font-size="18" font-family="monospace">trace(&quot;move&quot;);</text><path d="M477 161V192H485M635 243H711" fill="none" stroke="#91a2b3" stroke-width="1.5" stroke-dasharray="3 5"/><g class="command"><circle cx="0" cy="0" r="4" fill="#9bf3d0"/></g><rect x="403" y="208" width="232" height="113" fill="#13252a" rx="12" stroke="#34504e"/><text x="422" y="233" fill="#9bf3d0" font-size="10" letter-spacing="1.5">DEDICATED WORKER</text><text x="422" y="262" fill="#f0f3ee" font-size="24" font-weight="700">Rust + WASM</text><text x="422" y="292" fill="#91a2b3" font-size="12">Bounded script execution</text><rect x="505" y="171" width="147" height="24" fill="#9bf3d0" rx="12" fill-opacity="0.1" stroke="#9bf3d0" stroke-opacity="0.3"/><text x="578.5" y="187" fill="#9bf3d0" font-size="10" text-anchor="middle" letter-spacing="1">VALIDATE COMMANDS</text><rect x="711" y="192" width="209" height="129" fill="#0d1622" rx="12" stroke="#293847"/><text x="727" y="215" fill="#91a2b3" font-size="10" letter-spacing="1.3">SVG STAGE</text><path d="M731 282H900" fill="none" stroke="#293847" stroke-width="1"/><g class="script-node"><rect x="-13" y="-13" width="26" height="26" fill="#ff7954" rx="5"/><rect x="-20" y="-20" width="40" height="40" fill="none" stroke="#9bf3d0"/></g><text x="403" y="350" fill="#91a2b3" font-size="12">No DOM · No network · Commands commit on success</text><path d="M36 370H924" fill="none" stroke="#293847" stroke-width="1"/><text x="36" y="388" fill="#91a2b3" font-size="9" letter-spacing="1.5">RASH / OPEN MOTION STUDIO</text><text x="923" y="388" fill="#91a2b3" font-size="9" text-anchor="end" letter-spacing="0.8">SVG · NO SCRIPTS · NO EXTERNAL ASSETS</text></svg>
