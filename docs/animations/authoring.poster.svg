<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc"><title id="title">Rash / AUTHOR</title><desc id="desc">A selected vector moves across a stage as the timeline playhead travels between keyframes. Editorial workflow illustration.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.hero{transform:translate(660px,119px);animation:hero 7s cubic-bezier(.45,0,.55,1) infinite}@keyframes hero{0%,100%{transform:translate(570px,207px) scale(.75) rotate(-12deg)}50%{transform:translate(837px,148px) scale(1.1) rotate(12deg)}}.playhead{transform:translateX(700px);animation:playhead 7s cubic-bezier(.45,0,.55,1) infinite}@keyframes playhead{0%,100%{transform:translateX(550px)}50%{transform:translateX(869px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}*{animation:none!important}</style><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09131c"/><stop offset="1" stop-color="#121323"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#557184" opacity=".25"/></pattern></defs><rect x="0" y="0" width="960" height="400" fill="url(#bg)" rx="18"/><rect x="0.5" y="0.5" width="959" height="399" fill="none" rx="18" stroke="#293847"/><text x="36" y="68" fill="#ff7954" font-size="12" letter-spacing="2" font-weight="700">01 / AUTHOR</text><text x="33" y="148" fill="#f0f3ee" font-size="49" font-weight="800" letter-spacing="-2">A stage for</text><text x="33" y="202" fill="#f0f3ee" font-size="49" font-weight="800" letter-spacing="-2">your ideas.</text><text x="36" y="242" fill="#91a2b3" font-size="15">Draw a vector. Set a keyframe.</text><text x="36" y="265" fill="#91a2b3" font-size="15">Give every layer a little life.</text><rect x="36" y="296" width="36" height="3" fill="#ff7954" rx="1.5"/><text x="36" y="326" fill="#ff7954" font-size="10" letter-spacing="0.8">DRAW · KEYFRAME · PREVIEW</text><rect x="400" y="54" width="520" height="282" fill="#0d1622" rx="14" stroke="#293847"/><rect x="400" y="54" width="520" height="282" fill="url(#dots)" rx="14"/><rect x="400" y="54" width="520" height="30" fill="#172230" rx="14"/><rect x="400" y="69" width="520" height="15" fill="#172230"/><circle cx="417" cy="69" r="3" fill="#ff7954"/><circle cx="430" cy="69" r="3" fill="#b6a1ff"/><circle cx="443" cy="69" r="3" fill="#9bf3d0"/><text x="468" y="73" fill="#91a2b3" font-size="11" font-family="monospace">scene / first move</text><text x="900" y="73" fill="#9bf3d0" font-size="10" text-anchor="end">24 FPS</text><path d="M522 84V336M400 254H920" fill="none" stroke="#293847" stroke-width="1"/><text x="414" y="106" fill="#91a2b3" font-size="9" letter-spacing="1.3">LAYERS</text><rect x="409" y="115" width="103" height="25" fill="#32302e" rx="5"/><rect x="418.5" y="124.5" width="5" height="5" fill="#ff7954" transform="rotate(45 421 127)"/><text x="433" y="131" fill="#f0f3ee" font-size="11">Hero</text><rect x="409" y="147" width="103" height="25" fill="#131e2b" rx="5"/><rect x="418.5" y="156.5" width="5" height="5" fill="#9bf3d0" transform="rotate(45 421 159)"/><text x="433" y="163" fill="#91a2b3" font-size="11">Orbit</text><rect x="409" y="179" width="103" height="25" fill="#131e2b" rx="5"/><rect x="418.5" y="188.5" width="5" height="5" fill="#b6a1ff" transform="rotate(45 421 191)"/><text x="433" y="195" fill="#91a2b3" font-size="11">Backdrop</text><path d="M552 215C592 215 604 119 660 119S745 226 791 200S839 130 883 130" fill="none" stroke="#ff7954" stroke-width="1.4" stroke-dasharray="3 5" stroke-opacity="0.55"/><g class="hero"><circle cx="0" cy="0" r="25" fill="#ff7954"/><rect x="-34" y="-34" width="68" height="68" fill="none" stroke="#9bf3d0" stroke-width="1"/><rect x="-37" y="-37" width="6" height="6" fill="#0d1622" stroke="#9bf3d0"/><rect x="-37" y="31" width="6" height="6" fill="#0d1622" stroke="#9bf3d0"/><rect x="31" y="-37" width="6" height="6" fill="#0d1622" stroke="#9bf3d0"/><rect x="31" y="31" width="6" height="6" fill="#0d1622" stroke="#9bf3d0"/></g><text x="416" y="275" fill="#91a2b3" font-size="9" letter-spacing="1.1">TIMELINE</text><rect x="550" y="274" width="320" height="12" fill="#ff7954" rx="3" fill-opacity="0.18"/><rect x="547.5" y="277.5" width="5" height="5" fill="#ff7954" transform="rotate(45 550 280)"/><rect x="697.5" y="277.5" width="5" height="5" fill="#ff7954" transform="rotate(45 700 280)"/><rect x="866.5" y="277.5" width="5" height="5" fill="#ff7954" transform="rotate(45 869 280)"/><rect x="578" y="301" width="266" height="12" fill="#b6a1ff" rx="3" fill-opacity="0.18"/><rect x="575.5" y="304.5" width="5" height="5" fill="#b6a1ff" transform="rotate(45 578 307)"/><rect x="697.5" y="304.5" width="5" height="5" fill="#b6a1ff" transform="rotate(45 700 307)"/><rect x="840.5" y="304.5" width="5" height="5" fill="#b6a1ff" transform="rotate(45 843 307)"/><g class="playhead"><path d="M0 260V325" fill="none" stroke="#f0f3ee" stroke-width="1"/><path d="M-4 260H4V265L0 269L-4 265Z" fill="#f0f3ee" stroke="#f0f3ee" stroke-width="1"/></g><path d="M36 370H924" fill="none" stroke="#293847" stroke-width="1"/><text x="36" y="388" fill="#91a2b3" font-size="9" letter-spacing="1.5">RASH / OPEN MOTION STUDIO</text><text x="923" y="388" fill="#91a2b3" font-size="9" text-anchor="end" letter-spacing="0.8">SVG · NO SCRIPTS · NO EXTERNAL ASSETS</text></svg>
